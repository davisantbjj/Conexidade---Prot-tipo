<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F8">
<title>Conexidade</title>
<link rel="icon" type="image/png" href="assets/logo-conexidade.png">
<link rel="apple-touch-icon" href="assets/logo-conexidade.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--vb-ease:cubic-bezier(.32,.72,0,1);--vb-out:cubic-bezier(.23,1,.32,1)}
html,body{margin:0;height:100%}
body{background:#DCE2E8;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Inter',system-ui,sans-serif}
.device{position:relative;width:414px;height:868px;border-radius:60px;background:#111214;box-shadow:0 0 0 2px #3A3A3C inset,0 30px 70px rgba(15,26,36,.28);transform-origin:center center;flex-shrink:0}
.device::before,.device::after{content:"";position:absolute;width:3px;border-radius:2px;background:#2C2C2E}
.device::before{left:-3px;top:180px;height:62px;box-shadow:0 76px 0 #2C2C2E}
.device::after{right:-3px;top:250px;height:100px}
.tela{position:absolute;left:12px;top:12px;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#F2F5F8;isolation:isolate}
#screen,#sos{position:absolute;inset:0}
#sos{z-index:80;pointer-events:none}
#sos>*{pointer-events:auto}
.credito{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#5E6B78}
/* Celular de verdade: tela cheia, sem moldura */
body.full{background:#F2F5F8;align-items:flex-start}
body.full .device{border-radius:0;background:transparent;box-shadow:none;width:390px;height:844px;transform-origin:top left;position:absolute;left:0;top:0}
body.full .device::before,body.full .device::after,body.full .credito{display:none}
body.full .tela{left:0;top:0;border-radius:0}

/* ---------- Mapa (Leaflet) ---------- */
.vb-map{background:#E8ECEF}
.vb-tiles{filter:saturate(.72) contrast(.96) brightness(1.03)}
.vb-map .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7);border-radius:6px;margin:4px!important;padding:0 5px}
.vb-map-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5E6B78;font-size:14px}
.vb-pin-wrap{background:none;border:none}
.vb-pin{box-sizing:border-box;width:36px;height:36px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);transform-origin:50% 50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 4px 12px rgba(15,26,36,.28);display:flex;align-items:center;justify-content:center;transition:transform .38s var(--vb-out),opacity .3s,box-shadow .3s;cursor:pointer}
.vb-pin svg{transform:rotate(45deg)}
.vb-pin.is-sel{transform:rotate(-45deg) scale(1.3);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent),0 10px 20px rgba(15,26,36,.32)}
.vb-pin.is-hidden{transform:rotate(-45deg) scale(.15);opacity:0}
.vb-pin-wrap{transform-origin:50% 100%}

/* ---------- Emergência flutuante ---------- */
.vb-sos-fab{position:absolute;right:16px;width:60px;height:60px;border:none;border-radius:50%;background:#D7282F;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(215,40,47,.38),0 0 0 4px #fff;cursor:pointer;animation:vbFabIn .45s var(--vb-out) both;transition:transform .16s var(--vb-out),bottom .35s var(--vb-ease)}
.vb-sos-fab:active{transform:scale(.94)}
.vb-sos-pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid #D7282F;animation:vbPulse 2s var(--vb-out) infinite;pointer-events:none}
.vb-sos-tag{position:absolute;top:-6px;right:-8px;background:#1B2B3A;color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:8px;border:2px solid #fff}
@keyframes vbPulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.45);opacity:0}}
@keyframes vbFabIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.vb-sos-dim{position:absolute;inset:0;background:rgba(15,26,36,.45);animation:vbFade .2s both}
@keyframes vbFade{from{opacity:0}}
.vb-sos-panel{position:absolute;left:16px;right:16px;border-radius:24px;background:#fff;padding:14px 8px 10px;display:flex;flex-direction:column;gap:12px;color:#1B2B3A;box-shadow:0 18px 40px rgba(15,26,36,.3);transform-origin:calc(100% - 30px) 100%;animation:vbPanelIn .42s var(--vb-ease) both;font-family:'Inter',system-ui,sans-serif}
.vb-sos-panel.is-on{background:#B3261E;color:#fff;padding:14px 10px 14px 8px;overflow:visible}
@keyframes vbPanelIn{from{transform:scale(.18);opacity:0;border-radius:40px}to{transform:none;opacity:1}}
.vb-sos-head{display:flex;align-items:center;gap:12px;padding:0 6px}
.vb-sos-ico{width:42px;height:42px;border-radius:12px;background:#FDE8E8;color:#D7282F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vb-sos-ico.is-on{background:rgba(255,255,255,.18);color:#fff;animation:vbRing 1s ease-in-out infinite}
@keyframes vbRing{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.vb-sos-x{width:40px;height:40px;border:none;border-radius:50%;background:#EEF2F5;color:#5E6B78;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vb-sos-cancel{min-height:44px;border:1.5px solid rgba(255,255,255,.75);border-radius:22px;background:transparent;color:#fff;padding:0 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.vb-sos-ring{position:absolute;inset:0;border-radius:24px;border:2px solid #D7282F;animation:vbSosRing 1.6s var(--vb-out) infinite;pointer-events:none}
@keyframes vbSosRing{from{transform:scale(1);opacity:.8}to{transform:scale(1.05,1.25);opacity:0}}
.vb-sos-track{position:relative;height:72px;margin:0 0;border-radius:36px;background:#D7282F;overflow:hidden;box-shadow:0 6px 16px rgba(215,40,47,.25)}
.vb-sos-fill{position:absolute;left:0;top:0;bottom:0;border-radius:36px;background:rgba(120,10,14,.3)}
.vb-sos-label{position:absolute;left:80px;right:16px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:16px;font-weight:700;pointer-events:none}
.vb-sos-chev{display:flex;gap:1px;font-size:24px;font-weight:400;line-height:1}
.vb-sos-chev i{font-style:normal;display:inline-block;margin-left:-3px;animation:vbWave 1.1s ease-in-out infinite;opacity:.25}
@keyframes vbWave{0%,100%{opacity:.25;transform:translateX(0)}40%{opacity:1;transform:translateX(3px)}}
.vb-sos-knob{position:absolute;left:8px;top:8px;width:56px;height:56px;border:none;border-radius:50%;background:#fff;color:#D7282F;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0}
.vb-sos-knob:active{cursor:grabbing}
.vb-nudge{animation:vbNudge 1.4s ease-in-out infinite}
@keyframes vbNudge{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(4px);opacity:1}}
.vb-sos-tels{display:flex;gap:6px}
.vb-sos-tel{flex:1 1 auto;padding:0 8px;min-height:40px;border-radius:12px;background:#F2F5F8;color:#1B2B3A;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap;letter-spacing:-.1px}
@media (prefers-reduced-motion: reduce){.vb-sos-chev i,.vb-sos-pulse,.vb-nudge,.vb-sos-ring,.vb-sos-ico.is-on{animation:none}}
</style>
</head>
<body>
<div class="device" id="device">
<div class="tela" data-vb-root>
<div id="screen"></div>
<div id="sos"></div>
</div>
</div>
<div class="credito">Mapa: © colaboradores do OpenStreetMap</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="screens.js"></script>
<script>
  // Encaixa o iPhone na janela (desktop) ou ocupa a tela toda (celular)
  (function () {
    var dev = document.getElementById('device');
    function fit() {
      var w = window.innerWidth, hgt = window.innerHeight;
      var celular = w < 520 && matchMedia('(pointer: coarse)').matches;
      document.body.classList.toggle('full', celular);
      if (celular) { var k = w / 390; dev.style.transform = 'scale(' + k + ')'; document.body.style.height = (844 * k) + 'px'; }
      else { var s = Math.min(1, (hgt - 48) / 868, (w - 32) / 414); dev.style.transform = 'scale(' + s + ')'; document.body.style.height = ''; }
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
<script src="runtime.js"></script>
</body>
</html>
